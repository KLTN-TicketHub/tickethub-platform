name: CD - Build & Deploy

on:
  push:
    branches: [main]

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/kltn-tickethub/tickethub-platform

jobs:
  build-backend:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - service: identity-api
            dockerfile: src/backend/Services/Identity/Identity.API/Dockerfile
          - service: catalog-api
            dockerfile: src/backend/Services/Catalog/Catalog.API/Dockerfile
          - service: inventory-api
            dockerfile: src/backend/Services/Inventory/Inventory.API/Dockerfile
          - service: ordering-api
            dockerfile: src/backend/Services/Ordering/Ordering.API/Dockerfile
          - service: payment-api
            dockerfile: src/backend/Services/Payment/Payment.API/Dockerfile
          - service: finance-api
            dockerfile: src/backend/Services/Finance/Finance.API/Dockerfile
          - service: ai-api
            dockerfile: src/backend/Services/AI/AI.API/Dockerfile
          - service: notification-worker
            dockerfile: src/backend/Services/Notification/Notification.Worker/Dockerfile
          - service: gateway
            dockerfile: src/backend/ApiGateways/YarpApiGateway/Dockerfile
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push ${{ matrix.service }}
        uses: docker/build-push-action@v6
        with:
          context: src/backend
          file: ${{ matrix.dockerfile }}
          push: true
          tags: |
            ${{ env.IMAGE_PREFIX }}-${{ matrix.service }}:latest
            ${{ env.IMAGE_PREFIX }}-${{ matrix.service }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

  build-frontend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push frontend
        uses: docker/build-push-action@v6
        with:
          context: src/frontend
          push: true
          build-args: |
            VITE_API_URL=https://${{ secrets.DOMAIN }}/api/v1
          tags: |
            ${{ env.IMAGE_PREFIX }}-frontend:latest
            ${{ env.IMAGE_PREFIX }}-frontend:${{ github.sha }}
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend

  deploy:
    runs-on: ubuntu-latest
    needs: [build-backend, build-frontend]
    steps:
      - name: Deploy to VPS via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            cd ${{ secrets.VPS_DEPLOY_PATH }}
            git pull origin main
            sed -i '/^SEQ_BASICAUTH_USER=/d;/^SEQ_BASICAUTH_HASH=/d' src/backend/docker/prod/.env
            echo 'SEQ_BASICAUTH_USER=${{ secrets.SEQ_BASICAUTH_USER }}' >> src/backend/docker/prod/.env
            echo 'SEQ_BASICAUTH_HASH=${{ secrets.SEQ_BASICAUTH_HASH }}' >> src/backend/docker/prod/.env
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
            docker compose -f src/backend/docker/prod/docker-compose.prod.yml --env-file src/backend/docker/prod/.env pull
            docker compose -f src/backend/docker/prod/docker-compose.prod.yml --env-file src/backend/docker/prod/.env up -d
            docker compose -f src/backend/docker/prod/docker-compose.prod.yml --env-file src/backend/docker/prod/.env restart caddy
            docker image prune -f
