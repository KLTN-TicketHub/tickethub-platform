syntax = "proto3";

option csharp_namespace = "Catalog.API.Protos";

package catalog;

service CatalogGrpc {
  rpc GetCheckoutData (GetCheckoutDataRequest) returns (GetCheckoutDataResponse);

  rpc ValidateSeatLock (ValidateSeatLockRequest) returns (ValidateSeatLockResponse);

  rpc ValidateTicketTypes (ValidateTicketTypesRequest) returns (ValidateTicketTypesResponse);

  rpc GetCategoryTrend (GetCategoryTrendRequest) returns (GetCategoryTrendResponse);

  rpc GetOrganizerPortfolio (GetOrganizerPortfolioRequest) returns (GetOrganizerPortfolioResponse);

  rpc GetEventInsight (GetEventInsightRequest) returns (GetEventInsightResponse);

  rpc SearchEvents (SearchEventsRequest) returns (SearchEventsResponse);

  rpc GetEventDetail (GetEventDetailRequest) returns (GetEventDetailResponse);
}

message GetCheckoutDataRequest {
  string eventId = 1;
  string showtimeId = 2;
  repeated CheckoutRequestItem items = 3;
}

message CheckoutRequestItem {
  string seatId = 1;
  string ticketTypeId = 2;
  int32 quantity = 3;
}

message GetCheckoutDataResponse {
  bool isSuccess = 1;
  string message = 2;
  string eventTitle = 3;
  string organizerId = 4;
  string showtimeStartAt = 5;
  string showtimeEndAt = 6;
  repeated ValidatedCheckoutTicketItem ticketItems = 7;
  string organizerName = 8;
  string eventImage = 9;
}

message ValidatedCheckoutTicketItem {
  string seatId = 1;
  string ticketTypeId = 2;
  string ticketTypeName = 3;
  double price = 4;
  string seatName = 5;
  string rowName = 6;
  int32 quantity = 7;
}

message ValidateSeatLockRequest {
  string showtimeId = 1;
  repeated string seatIds = 2;
}

message ValidateSeatLockResponse {
  bool isSuccess = 1;
  string message = 2;
}

message ValidateTicketTypesRequest {
  string showtimeId = 1;
  repeated TicketTypeQuantityItem ticketItems = 2;
}

message TicketTypeQuantityItem {
  string ticketTypeId = 1;
  int32 quantity = 2;
}

message ValidateTicketTypesResponse {
  bool isSuccess = 1;
  string message = 2;
}

message GetCategoryTrendRequest {
  string from = 1;
  string to = 2;
}

message CategoryTrendItem {
  string categoryId = 1;
  string categoryName = 2;
  int64 viewCount = 3;
  int64 purchaseIntentCount = 4;
  int32 activeEventCount = 5;
  double viewGrowthPercent = 6;
  double avgOverallRating = 7;
  int32 ratingSampleSize = 8;
}

message GetCategoryTrendResponse {
  bool isSuccess = 1;
  string message = 2;
  repeated CategoryTrendItem categories = 3;
}

message GetOrganizerPortfolioRequest {
  string organizerId = 1;
  string from = 2;
  string to = 3;
}

message OrganizerPortfolioCategoryItem {
  string categoryId = 1;
  string categoryName = 2;
  int32 eventCount = 3;
}

message OrganizerPortfolioEventItem {
  string eventId = 1;
  string eventTitle = 2;
  int64 viewCount = 3;
  int64 purchaseIntentCount = 4;
  double conversionRate = 5;
  double overallRatingAvg = 6;
  int32 ratingSampleSize = 7;
  string lowestRatingDimension = 8;
}

message GetOrganizerPortfolioResponse {
  bool isSuccess = 1;
  string message = 2;
  repeated OrganizerPortfolioCategoryItem categoryDistribution = 3;
  repeated OrganizerPortfolioEventItem events = 4;
}

message GetEventInsightRequest {
  string eventId = 1;
  string organizerId = 2;
  string from = 3;
  string to = 4;
}

message GetEventInsightResponse {
  bool isSuccess = 1;
  string message = 2;
  string eventTitle = 3;
  int64 viewCount = 4;
  int64 purchaseIntentCount = 5;
  double conversionRate = 6;
  double soundAvg = 7;
  double visualAvg = 8;
  double organizationAvg = 9;
  double facilityAvg = 10;
  double serviceAvg = 11;
  double performanceAvg = 12;
  double overallAvg = 13;
  int32 ratingSampleSize = 14;
  repeated string recentComments = 15;
}

message SearchEventsRequest {
  string search = 1;
  string categoryId = 2;
  string provinceCity = 3;
  int32 pageSize = 4;
}

message EventSummaryItem {
  string eventId = 1;
  string title = 2;
  string startAt = 3;
  string endAt = 4;
  double minPrice = 5;
  string categoryName = 6;
  string provinceCity = 7;
}

message SearchEventsResponse {
  bool isSuccess = 1;
  string message = 2;
  repeated EventSummaryItem events = 3;
}

message GetEventDetailRequest {
  string eventId = 1;
}

message EventTicketTypeItem {
  string ticketTypeName = 1;
  double price = 2;
  int32 publishedQuota = 3;
}

message EventShowtimeItem {
  string showtimeId = 1;
  string startAt = 2;
  string endAt = 3;
  repeated EventTicketTypeItem ticketTypes = 4;
}

message GetEventDetailResponse {
  bool isSuccess = 1;
  string message = 2;
  string title = 3;
  string description = 4;
  string categoryName = 5;
  string provinceCity = 6;
  string venueName = 7;
  string addressLine = 8;
  repeated EventShowtimeItem showtimes = 9;
}
