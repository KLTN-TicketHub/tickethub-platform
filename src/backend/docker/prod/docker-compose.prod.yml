networks:
  tickethub-net:
    driver: bridge

volumes:
  sqlserver_notification_data:
  sqlserver_identity_data:
  sqlserver_catalog_data:
  sqlserver_inventory_data:
  sqlserver_ordering_data:
  sqlserver_payment_data:
  sqlserver_finance_data:
  sqlserver_ai_data:
  redis_identity_data:
  redis_catalog_data:
  redis_inventory_data:
  redis_ordering_data:
  redis_payment_data:
  redis_finance_data:
  redis_ai_data:
  redis_notification_data:
  rabbitmq_data:
  caddy_data:
  caddy_config:
  catalog_uploads:
  identity_uploads:
  identity_dataprotection_keys:

services:
  sqlserver-notification:
    image: mcr.microsoft.com/mssql/server:2022-latest
    restart: unless-stopped
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: Express
      MSSQL_SA_PASSWORD: ${NOTIFICATION_SA_PASSWORD}
    volumes:
      - sqlserver_notification_data:/var/opt/mssql
    networks:
      - tickethub-net
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -Q 'SELECT 1' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

  sqlserver-identity:
    image: mcr.microsoft.com/mssql/server:2022-latest
    restart: unless-stopped
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: Express
      MSSQL_SA_PASSWORD: ${IDENTITY_SA_PASSWORD}
    volumes:
      - sqlserver_identity_data:/var/opt/mssql
    networks:
      - tickethub-net
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -Q 'SELECT 1' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

  sqlserver-catalog:
    image: mcr.microsoft.com/mssql/server:2022-latest
    restart: unless-stopped
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: Express
      MSSQL_SA_PASSWORD: ${CATALOG_SA_PASSWORD}
    volumes:
      - sqlserver_catalog_data:/var/opt/mssql
    networks:
      - tickethub-net
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -Q 'SELECT 1' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

  sqlserver-inventory:
    image: mcr.microsoft.com/mssql/server:2022-latest
    restart: unless-stopped
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: Express
      MSSQL_SA_PASSWORD: ${INVENTORY_SA_PASSWORD}
    volumes:
      - sqlserver_inventory_data:/var/opt/mssql
    networks:
      - tickethub-net
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -Q 'SELECT 1' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

  sqlserver-ordering:
    image: mcr.microsoft.com/mssql/server:2022-latest
    restart: unless-stopped
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: Express
      MSSQL_SA_PASSWORD: ${ORDERING_SA_PASSWORD}
    volumes:
      - sqlserver_ordering_data:/var/opt/mssql
    networks:
      - tickethub-net
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -Q 'SELECT 1' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

  sqlserver-payment:
    image: mcr.microsoft.com/mssql/server:2022-latest
    restart: unless-stopped
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: Express
      MSSQL_SA_PASSWORD: ${PAYMENT_SA_PASSWORD}
    volumes:
      - sqlserver_payment_data:/var/opt/mssql
    networks:
      - tickethub-net
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -Q 'SELECT 1' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

  sqlserver-finance:
    image: mcr.microsoft.com/mssql/server:2022-latest
    restart: unless-stopped
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: Express
      MSSQL_SA_PASSWORD: ${FINANCE_SA_PASSWORD}
    volumes:
      - sqlserver_finance_data:/var/opt/mssql
    networks:
      - tickethub-net
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -Q 'SELECT 1' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

  sqlserver-ai:
    image: mcr.microsoft.com/mssql/server:2022-latest
    restart: unless-stopped
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: Express
      MSSQL_SA_PASSWORD: ${AI_SA_PASSWORD}
    volumes:
      - sqlserver_ai_data:/var/opt/mssql
    networks:
      - tickethub-net
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -Q 'SELECT 1' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis-identity:
    image: redis:7-alpine
    restart: unless-stopped
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --notify-keyspace-events
      - Ex
    volumes:
      - redis_identity_data:/data
    networks:
      - tickethub-net

  redis-catalog:
    image: redis:7-alpine
    restart: unless-stopped
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --notify-keyspace-events
      - Ex
    volumes:
      - redis_catalog_data:/data
    networks:
      - tickethub-net

  redis-inventory:
    image: redis:7-alpine
    restart: unless-stopped
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --notify-keyspace-events
      - Ex
    volumes:
      - redis_inventory_data:/data
    networks:
      - tickethub-net

  redis-ordering:
    image: redis:7-alpine
    restart: unless-stopped
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --notify-keyspace-events
      - Ex
    volumes:
      - redis_ordering_data:/data
    networks:
      - tickethub-net

  redis-payment:
    image: redis:7-alpine
    restart: unless-stopped
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --notify-keyspace-events
      - Ex
    volumes:
      - redis_payment_data:/data
    networks:
      - tickethub-net

  redis-finance:
    image: redis:7-alpine
    restart: unless-stopped
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --notify-keyspace-events
      - Ex
    volumes:
      - redis_finance_data:/data
    networks:
      - tickethub-net

  redis-ai:
    image: redis:7-alpine
    restart: unless-stopped
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --notify-keyspace-events
      - Ex
    volumes:
      - redis_ai_data:/data
    networks:
      - tickethub-net

  redis-notification:
    image: redis:7-alpine
    restart: unless-stopped
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --notify-keyspace-events
      - Ex
    volumes:
      - redis_notification_data:/data
    networks:
      - tickethub-net

  rabbitmq:
    image: heidiks/rabbitmq-delayed-message-exchange:3.13.3-management
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    networks:
      - tickethub-net

  identity-api:
    image: ghcr.io/kltn-tickethub/tickethub-platform-identity-api:latest
    build:
      context: ../../
      dockerfile: Services/Identity/Identity.API/Dockerfile
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:8080
    volumes:
      - ${SECRETS_DIR}/identity/appsettings.Production.json:/app/appsettings.Production.json:ro
      - ../../Services/Identity/Identity.API/Keys:/app/Keys:ro
      - identity_dataprotection_keys:/root/.aspnet/DataProtection-Keys
      - identity_uploads:/app/wwwroot/uploads
    depends_on:
      sqlserver-identity:
        condition: service_healthy
      redis-identity:
        condition: service_started
      rabbitmq:
        condition: service_started
    networks:
      - tickethub-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  catalog-api:
    image: ghcr.io/kltn-tickethub/tickethub-platform-catalog-api:latest
    build:
      context: ../../
      dockerfile: Services/Catalog/Catalog.API/Dockerfile
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_HTTP_PORTS: ""
    volumes:
      - ${SECRETS_DIR}/catalog/appsettings.Production.json:/app/appsettings.Production.json:ro
      - ../../Services/Catalog/Catalog.API/Keys:/app/Keys:ro
      - catalog_uploads:/app/wwwroot/uploads
    depends_on:
      sqlserver-catalog:
        condition: service_healthy
      redis-catalog:
        condition: service_started
      rabbitmq:
        condition: service_started
    networks:
      - tickethub-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  inventory-api:
    image: ghcr.io/kltn-tickethub/tickethub-platform-inventory-api:latest
    build:
      context: ../../
      dockerfile: Services/Inventory/Inventory.API/Dockerfile
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_HTTP_PORTS: ""
    volumes:
      - ${SECRETS_DIR}/inventory/appsettings.Production.json:/app/appsettings.Production.json:ro
      - ../../Services/Inventory/Inventory.API/Keys:/app/Keys:ro
    depends_on:
      sqlserver-inventory:
        condition: service_healthy
      redis-inventory:
        condition: service_started
      rabbitmq:
        condition: service_started
      catalog-api:
        condition: service_healthy
    networks:
      - tickethub-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  ordering-api:
    image: ghcr.io/kltn-tickethub/tickethub-platform-ordering-api:latest
    build:
      context: ../../
      dockerfile: Services/Ordering/Ordering.API/Dockerfile
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_HTTP_PORTS: ""
    volumes:
      - ${SECRETS_DIR}/ordering/appsettings.Production.json:/app/appsettings.Production.json:ro
      - ../../Services/Ordering/Ordering.API/Keys:/app/Keys:ro
    depends_on:
      sqlserver-ordering:
        condition: service_healthy
      redis-ordering:
        condition: service_started
      rabbitmq:
        condition: service_started
      inventory-api:
        condition: service_healthy
      catalog-api:
        condition: service_healthy
    networks:
      - tickethub-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  payment-api:
    image: ghcr.io/kltn-tickethub/tickethub-platform-payment-api:latest
    build:
      context: ../../
      dockerfile: Services/Payment/Payment.API/Dockerfile
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:8080
    volumes:
      - ${SECRETS_DIR}/payment/appsettings.Production.json:/app/appsettings.Production.json:ro
      - ../../Services/Payment/Payment.API/Keys:/app/Keys:ro
    depends_on:
      sqlserver-payment:
        condition: service_healthy
      redis-payment:
        condition: service_started
      rabbitmq:
        condition: service_started
    networks:
      - tickethub-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  finance-api:
    image: ghcr.io/kltn-tickethub/tickethub-platform-finance-api:latest
    build:
      context: ../../
      dockerfile: Services/Finance/Finance.API/Dockerfile
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:8080
    volumes:
      - ${SECRETS_DIR}/finance/appsettings.Production.json:/app/appsettings.Production.json:ro
      - ../../Services/Finance/Finance.API/Keys:/app/Keys:ro
    depends_on:
      sqlserver-finance:
        condition: service_healthy
      redis-finance:
        condition: service_started
      rabbitmq:
        condition: service_started
    networks:
      - tickethub-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  ai-api:
    image: ghcr.io/kltn-tickethub/tickethub-platform-ai-api:latest
    build:
      context: ../../
      dockerfile: Services/AI/AI.API/Dockerfile
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:8080
    volumes:
      - ${SECRETS_DIR}/ai/appsettings.Production.json:/app/appsettings.Production.json:ro
      - ../../Services/AI/AI.API/Keys:/app/Keys:ro
    depends_on:
      sqlserver-ai:
        condition: service_healthy
      redis-ai:
        condition: service_started
      catalog-api:
        condition: service_healthy
      ordering-api:
        condition: service_healthy
    networks:
      - tickethub-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  notification-api:
    image: ghcr.io/kltn-tickethub/tickethub-platform-notification-api:latest
    build:
      context: ../../
      dockerfile: Services/Notification/Notification.API/Dockerfile
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:8080
    volumes:
      - ${SECRETS_DIR}/notification-api/appsettings.Production.json:/app/appsettings.Production.json:ro
      - ../../Services/Notification/Notification.API/Keys:/app/Keys:ro
    depends_on:
      sqlserver-notification:
        condition: service_healthy
      redis-notification:
        condition: service_started
      rabbitmq:
        condition: service_started
    networks:
      - tickethub-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  notification-worker:
    image: ghcr.io/kltn-tickethub/tickethub-platform-notification-worker:latest
    build:
      context: ../../
      dockerfile: Services/Notification/Notification.Worker/Dockerfile
    restart: unless-stopped
    environment:
      DOTNET_ENVIRONMENT: Production
    volumes:
      - ${SECRETS_DIR}/notification/appsettings.Production.json:/app/appsettings.Production.json:ro
    depends_on:
      rabbitmq:
        condition: service_started
    networks:
      - tickethub-net

  gateway:
    image: ghcr.io/kltn-tickethub/tickethub-platform-gateway:latest
    build:
      context: ../../
      dockerfile: ApiGateways/YarpApiGateway/Dockerfile
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:8080
    volumes:
      - ./appsettings-templates/YarpApiGateway.appsettings.Production.json:/app/appsettings.Production.json:ro
    depends_on:
      identity-api:
        condition: service_healthy
      catalog-api:
        condition: service_healthy
      inventory-api:
        condition: service_healthy
      ordering-api:
        condition: service_healthy
      payment-api:
        condition: service_healthy
      finance-api:
        condition: service_healthy
      ai-api:
        condition: service_healthy
      notification-api:
        condition: service_healthy
    networks:
      - tickethub-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  frontend:
    image: ghcr.io/kltn-tickethub/tickethub-platform-frontend:latest
    build:
      context: ../../../frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: https://${DOMAIN}/api/v1
    restart: unless-stopped
    depends_on:
      gateway:
        condition: service_healthy
    networks:
      - tickethub-net

  caddy:
    image: caddy:2
    restart: unless-stopped
    environment:
      DOMAIN: ${DOMAIN}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - gateway
      - frontend
      - rabbitmq
    networks:
      - tickethub-net
