networks:
  tickethub-net:
    driver: bridge

volumes:
  sqlserver_data:
  redis_data:
  rabbitmq_data:
  seq_data:
  caddy_data:
  caddy_config:
  catalog_uploads:
  identity_uploads:
  identity_dataprotection_keys:

services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    restart: unless-stopped
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${SA_PASSWORD}
    volumes:
      - sqlserver_data:/var/opt/mssql
    networks:
      - tickethub-net
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -Q 'SELECT 1' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

  sqlserver-init:
    image: mcr.microsoft.com/mssql/server:2022-latest
    depends_on:
      sqlserver:
        condition: service_healthy
    volumes:
      - ./init-hangfire-db.sql:/init-hangfire-db.sql:ro
    networks:
      - tickethub-net
    entrypoint: ["/opt/mssql-tools18/bin/sqlcmd", "-S", "sqlserver", "-U", "sa", "-P", "${SA_PASSWORD}", "-C", "-i", "/init-hangfire-db.sql"]
    restart: "no"

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --notify-keyspace-events
      - Ex
    volumes:
      - redis_data:/data
    networks:
      - tickethub-net

  rabbitmq:
    image: heidiks/rabbitmq-delayed-message-exchange:3.13.3-management
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    networks:
      - tickethub-net

  seq:
    image: datalust/seq:latest
    restart: unless-stopped
    environment:
      ACCEPT_EULA: "Y"
    volumes:
      - seq_data:/data
    networks:
      - tickethub-net

  identity-api:
    image: ghcr.io/kltn-tickethub/tickethub-platform-identity-api:latest
    build:
      context: ../../
      dockerfile: Services/Identity/Identity.API/Dockerfile
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:8080
    volumes:
      - ${SECRETS_DIR}/identity/appsettings.Production.json:/app/appsettings.Production.json:ro
      - ../../Services/Identity/Identity.API/Keys:/app/Keys:ro
      - identity_dataprotection_keys:/root/.aspnet/DataProtection-Keys
      - identity_uploads:/app/wwwroot/uploads
    depends_on:
      sqlserver:
        condition: service_healthy
      sqlserver-init:
        condition: service_completed_successfully
      redis:
        condition: service_started
      rabbitmq:
        condition: service_started
    networks:
      - tickethub-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  catalog-api:
    image: ghcr.io/kltn-tickethub/tickethub-platform-catalog-api:latest
    build:
      context: ../../
      dockerfile: Services/Catalog/Catalog.API/Dockerfile
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_HTTP_PORTS: ""
    volumes:
      - ${SECRETS_DIR}/catalog/appsettings.Production.json:/app/appsettings.Production.json:ro
      - ../../Services/Catalog/Catalog.API/Keys:/app/Keys:ro
      - catalog_uploads:/app/wwwroot/uploads
    depends_on:
      sqlserver:
        condition: service_healthy
      redis:
        condition: service_started
      rabbitmq:
        condition: service_started
    networks:
      - tickethub-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  inventory-api:
    image: ghcr.io/kltn-tickethub/tickethub-platform-inventory-api:latest
    build:
      context: ../../
      dockerfile: Services/Inventory/Inventory.API/Dockerfile
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_HTTP_PORTS: ""
    volumes:
      - ${SECRETS_DIR}/inventory/appsettings.Production.json:/app/appsettings.Production.json:ro
      - ../../Services/Inventory/Inventory.API/Keys:/app/Keys:ro
    depends_on:
      sqlserver:
        condition: service_healthy
      redis:
        condition: service_started
      rabbitmq:
        condition: service_started
      catalog-api:
        condition: service_healthy
    networks:
      - tickethub-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  ordering-api:
    image: ghcr.io/kltn-tickethub/tickethub-platform-ordering-api:latest
    build:
      context: ../../
      dockerfile: Services/Ordering/Ordering.API/Dockerfile
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_HTTP_PORTS: ""
    volumes:
      - ${SECRETS_DIR}/ordering/appsettings.Production.json:/app/appsettings.Production.json:ro
      - ../../Services/Ordering/Ordering.API/Keys:/app/Keys:ro
    depends_on:
      sqlserver:
        condition: service_healthy
      redis:
        condition: service_started
      rabbitmq:
        condition: service_started
      inventory-api:
        condition: service_healthy
      catalog-api:
        condition: service_healthy
    networks:
      - tickethub-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  payment-api:
    image: ghcr.io/kltn-tickethub/tickethub-platform-payment-api:latest
    build:
      context: ../../
      dockerfile: Services/Payment/Payment.API/Dockerfile
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:8080
    volumes:
      - ${SECRETS_DIR}/payment/appsettings.Production.json:/app/appsettings.Production.json:ro
      - ../../Services/Payment/Payment.API/Keys:/app/Keys:ro
    depends_on:
      sqlserver:
        condition: service_healthy
      redis:
        condition: service_started
      rabbitmq:
        condition: service_started
    networks:
      - tickethub-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  finance-api:
    image: ghcr.io/kltn-tickethub/tickethub-platform-finance-api:latest
    build:
      context: ../../
      dockerfile: Services/Finance/Finance.API/Dockerfile
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:8080
    volumes:
      - ${SECRETS_DIR}/finance/appsettings.Production.json:/app/appsettings.Production.json:ro
      - ../../Services/Finance/Finance.API/Keys:/app/Keys:ro
    depends_on:
      sqlserver:
        condition: service_healthy
      redis:
        condition: service_started
      rabbitmq:
        condition: service_started
    networks:
      - tickethub-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  ai-api:
    image: ghcr.io/kltn-tickethub/tickethub-platform-ai-api:latest
    build:
      context: ../../
      dockerfile: Services/AI/AI.API/Dockerfile
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:8080
    volumes:
      - ${SECRETS_DIR}/ai/appsettings.Production.json:/app/appsettings.Production.json:ro
      - ../../Services/AI/AI.API/Keys:/app/Keys:ro
    depends_on:
      redis:
        condition: service_started
      catalog-api:
        condition: service_healthy
      ordering-api:
        condition: service_healthy
    networks:
      - tickethub-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  notification-worker:
    image: ghcr.io/kltn-tickethub/tickethub-platform-notification-worker:latest
    build:
      context: ../../
      dockerfile: Services/Notification/Notification.Worker/Dockerfile
    restart: unless-stopped
    environment:
      DOTNET_ENVIRONMENT: Production
    volumes:
      - ${SECRETS_DIR}/notification/appsettings.Production.json:/app/appsettings.Production.json:ro
    depends_on:
      rabbitmq:
        condition: service_started
    networks:
      - tickethub-net

  gateway:
    image: ghcr.io/kltn-tickethub/tickethub-platform-gateway:latest
    build:
      context: ../../
      dockerfile: ApiGateways/YarpApiGateway/Dockerfile
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:8080
    volumes:
      - ./appsettings-templates/YarpApiGateway.appsettings.Production.json:/app/appsettings.Production.json:ro
    depends_on:
      identity-api:
        condition: service_healthy
      catalog-api:
        condition: service_healthy
      inventory-api:
        condition: service_healthy
      ordering-api:
        condition: service_healthy
      payment-api:
        condition: service_healthy
      finance-api:
        condition: service_healthy
      ai-api:
        condition: service_healthy
    networks:
      - tickethub-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  frontend:
    image: ghcr.io/kltn-tickethub/tickethub-platform-frontend:latest
    build:
      context: ../../../frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: https://${DOMAIN}/api/v1
    restart: unless-stopped
    depends_on:
      gateway:
        condition: service_healthy
    networks:
      - tickethub-net

  caddy:
    image: caddy:2
    restart: unless-stopped
    environment:
      DOMAIN: ${DOMAIN}
      SEQ_BASICAUTH_USER: ${SEQ_BASICAUTH_USER}
      SEQ_BASICAUTH_HASH: ${SEQ_BASICAUTH_HASH}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - gateway
      - frontend
    networks:
      - tickethub-net
