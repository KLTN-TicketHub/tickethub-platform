        <path fill="rgba(99, 102, 241, 0.08)" stroke="#6366f1" stroke-width="2.5" stroke-linejoin="round" d="M 80 180 L 420 220 L 360 380 L 40 330 Z"/>
        
        <!-- Label -->
        <text x="220" y="360" fill="#a5b4fc" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" transform="rotate(7, 220, 360)">KHU VIP CHÉO (SLANTED)</text>

        <!-- ROW A (5 seats) -->
        <text x="130" y="214" fill="#a5b4fc" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="900" text-anchor="middle">A</text>
        <circle id="Slan_A_1" cx="160.0" cy="210.0" r="10.5" fill="#0b0f19" stroke="#6366f1" stroke-width="2.5"/>
        <circle id="Slan_A_2" cx="195.0" cy="214.5" r="10.5" fill="#0b0f19" stroke="#6366f1" stroke-width="2.5"/>
        <circle id="Slan_A_3" cx="230.0" cy="219.0" r="10.5" fill="#0b0f19" stroke="#6366f1" stroke-width="2.5"/>
        <circle id="Slan_A_4" cx="265.0" cy="223.5" r="10.5" fill="#0b0f19" stroke="#6366f1" stroke-width="2.5"/>
        <circle id="Slan_A_5" cx="300.0" cy="228.0" r="10.5" fill="#0b0f19" stroke="#6366f1" stroke-width="2.5"/>
        <text x="330" y="232" fill="#a5b4fc" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="900" text-anchor="middle">A</text>

        <!-- ROW B (5 seats) -->
        <text x="115" y="254" fill="#a5b4fc" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="900" text-anchor="middle">B</text>
        <circle id="Slan_B_1" cx="145.0" cy="250.0" r="10.5" fill="#0b0f19" stroke="#6366f1" stroke-width="2.5"/>
        <circle id="Slan_B_2" cx="180.0" cy="254.5" r="10.5" fill="#0b0f19" stroke="#6366f1" stroke-width="2.5"/>
        <circle id="Slan_B_3" cx="215.0" cy="259.0" r="10.5" fill="#0b0f19" stroke="#6366f1" stroke-width="2.5"/>
        <circle id="Slan_B_4" cx="250.0" cy="263.5" r="10.5" fill="#0b0f19" stroke="#6366f1" stroke-width="2.5"/>
        <circle id="Slan_B_5" cx="285.0" cy="268.0" r="10.5" fill="#0b0f19" stroke="#6366f1" stroke-width="2.5"/>
        <text x="315" y="272" fill="#a5b4fc" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="900" text-anchor="middle">B</text>

