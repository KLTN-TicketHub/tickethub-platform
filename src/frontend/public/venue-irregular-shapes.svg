<svg xmlns="http://www.w3.org/2000/svg" width="999" height="666" viewBox="0 0 999 666" fill="none">
    <!-- Premium Dark Mode Background -->
    <rect width="999" height="666" fill="#0b0f19"/>

    <!-- STAGE Zone (isStage=true, no seats, trapezoid + spotlights decoration) -->
    <g id="STAGE">
        <!-- Ambient Stage Glow (Behind Stage) -->
        <path fill="rgba(56, 189, 248, 0.08)" d="M 300 20 L 700 20 L 750 150 L 250 150 Z"/>
        
        <!-- Main Trapezoid Stage Platform -->
        <path fill="#1e293b" stroke="#38bdf8" stroke-width="3" d="M 330 30 L 670 30 C 690 70 680 120 640 130 C 580 145 420 145 360 130 C 320 120 310 70 330 30 Z"/>
        
        <!-- Spotlight Cone Left -->
        <path fill="rgba(56, 189, 248, 0.04)" d="M 350 30 L 100 400 L 250 430 Z"/>
        
        <!-- Spotlight Cone Right -->
        <path fill="rgba(56, 189, 248, 0.04)" d="M 650 30 L 750 430 L 900 400 Z"/>

        <!-- Led Border (Decorative Segmented Lines) -->
        <path stroke="rgba(56, 189, 248, 0.5)" stroke-width="2" stroke-dasharray="6,4" d="M 345 40 L 655 40"/>

        <!-- Stage Text Label -->
        <text x="500" y="85" fill="#f8fafc" font-family="system-ui, -apple-system, sans-serif" font-size="18" font-weight="900" letter-spacing="4" text-anchor="middle">SÂN KHẤU CHÍNH</text>
        <text x="500" y="105" fill="#38bdf8" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="bold" letter-spacing="1" text-anchor="middle">MAIN STAGE</text>
    </g>

    <!-- Zone 1: Zone-VIP-Slanted (Seated, Slanted Polygon shape on the Left) -->
    <g id="Zone-VIP-Slanted">
