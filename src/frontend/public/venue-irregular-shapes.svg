        <text x="100" y="294" fill="#a5b4fc" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="900" text-anchor="middle">C</text>
        <circle id="Slan_C_1" cx="130.0" cy="290.0" r="10.5" fill="#0b0f19" stroke="#6366f1" stroke-width="2.5"/>
        <circle id="Slan_C_2" cx="165.0" cy="294.5" r="10.5" fill="#0b0f19" stroke="#6366f1" stroke-width="2.5"/>
        <circle id="Slan_C_3" cx="200.0" cy="299.0" r="10.5" fill="#0b0f19" stroke="#6366f1" stroke-width="2.5"/>
        <circle id="Slan_C_4" cx="235.0" cy="303.5" r="10.5" fill="#0b0f19" stroke="#6366f1" stroke-width="2.5"/>
        <circle id="Slan_C_5" cx="270.0" cy="308.0" r="10.5" fill="#0b0f19" stroke="#6366f1" stroke-width="2.5"/>
        <text x="300" y="312" fill="#a5b4fc" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="900" text-anchor="middle">C</text>

        <!-- ROW D (5 seats) -->
        <text x="85" y="334" fill="#a5b4fc" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="900" text-anchor="middle">D</text>
        <circle id="Slan_D_1" cx="115.0" cy="330.0" r="10.5" fill="#0b0f19" stroke="#6366f1" stroke-width="2.5"/>
        <circle id="Slan_D_2" cx="150.0" cy="334.5" r="10.5" fill="#0b0f19" stroke="#6366f1" stroke-width="2.5"/>
        <circle id="Slan_D_3" cx="185.0" cy="339.0" r="10.5" fill="#0b0f19" stroke="#6366f1" stroke-width="2.5"/>
        <circle id="Slan_D_4" cx="220.0" cy="343.5" r="10.5" fill="#0b0f19" stroke="#6366f1" stroke-width="2.5"/>
        <circle id="Slan_D_5" cx="255.0" cy="348.0" r="10.5" fill="#0b0f19" stroke="#6366f1" stroke-width="2.5"/>
        <text x="285" y="352" fill="#a5b4fc" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="900" text-anchor="middle">D</text>
