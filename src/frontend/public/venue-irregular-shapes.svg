        <circle id="Cres_A_1" cx="620.0" cy="210.0" r="10.5" fill="#0b0f19" stroke="#f59e0b" stroke-width="2.5"/>
        <circle id="Cres_A_2" cx="670.0" cy="195.0" r="10.5" fill="#0b0f19" stroke="#f59e0b" stroke-width="2.5"/>
        <circle id="Cres_A_3" cx="720.0" cy="188.0" r="10.5" fill="#0b0f19" stroke="#f59e0b" stroke-width="2.5"/>
