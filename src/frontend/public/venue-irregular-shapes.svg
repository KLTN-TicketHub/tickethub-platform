        <!-- ROW B (6 seats) -->
        <text x="605" y="254" fill="#fde047" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="900" text-anchor="middle">B</text>
        <circle id="Cres_B_1" cx="635.0" cy="250.0" r="10.5" fill="#0b0f19" stroke="#f59e0b" stroke-width="2.5"/>
        <circle id="Cres_B_2" cx="682.0" cy="236.0" r="10.5" fill="#0b0f19" stroke="#f59e0b" stroke-width="2.5"/>
        <circle id="Cres_B_3" cx="730.0" cy="230.0" r="10.5" fill="#0b0f19" stroke="#f59e0b" stroke-width="2.5"/>
        <circle id="Cres_B_4" cx="778.0" cy="230.0" r="10.5" fill="#0b0f19" stroke="#f59e0b" stroke-width="2.5"/>
        <circle id="Cres_B_5" cx="826.0" cy="236.0" r="10.5" fill="#0b0f19" stroke="#f59e0b" stroke-width="2.5"/>
        <circle id="Cres_B_6" cx="873.0" cy="250.0" r="10.5" fill="#0b0f19" stroke="#f59e0b" stroke-width="2.5"/>
        <text x="903" y="254" fill="#fde047" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="900" text-anchor="middle">B</text>

        <!-- ROW C (6 seats) -->
        <text x="620" y="294" fill="#fde047" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="900" text-anchor="middle">C</text>
        <circle id="Cres_C_1" cx="650.0" cy="290.0" r="10.5" fill="#0b0f19" stroke="#f59e0b" stroke-width="2.5"/>
        <circle id="Cres_C_2" cx="695.0" cy="277.0" r="10.5" fill="#0b0f19" stroke="#f59e0b" stroke-width="2.5"/>
        <circle id="Cres_C_3" cx="740.0" cy="272.0" r="10.5" fill="#0b0f19" stroke="#f59e0b" stroke-width="2.5"/>
        <circle id="Cres_C_4" cx="785.0" cy="272.0" r="10.5" fill="#0b0f19" stroke="#f59e0b" stroke-width="2.5"/>
        <circle id="Cres_C_5" cx="830.0" cy="277.0" r="10.5" fill="#0b0f19" stroke="#f59e0b" stroke-width="2.5"/>
        <circle id="Cres_C_6" cx="875.0" cy="290.0" r="10.5" fill="#0b0f19" stroke="#f59e0b" stroke-width="2.5"/>
        <text x="905" y="294" fill="#fde047" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="900" text-anchor="middle">C</text>
    </g>

    <!-- Zone 3: Zone-GA-Standing (Standing, Wavy organic shape - No seats) -->
    <g id="Zone-GA-Standing">
        <!-- Wavy Curved Background Path (No circles inside) -->
        <path fill="rgba(16, 185, 129, 0.05)" stroke="#10b981" stroke-width="2.5" stroke-linejoin="round" d="M 60 440 Q 280 400 500 440 Q 720 400 940 440 L 910 610 Q 500 640 90 610 Z"/>
        
        <!-- Decorative Grid dots (representing crowd standing spots without being sellable seats) -->
        <!-- These are paths so they don't get parsed as sellable seat circles (only <circle> is parsed as seat) -->
        <path d="M 120 480 L 122 480 M 160 480 L 162 480 M 200 480 L 202 480 M 240 480 L 242 480 M 280 480 L 282 480 M 320 480 L 322 480 M 360 480 L 362 480 M 400 480 L 402 480 M 440 480 L 442 480 M 480 480 L 482 480 M 520 480 L 522 480 M 560 480 L 562 480 M 600 480 L 602 480 M 640 480 L 642 480 M 680 480 L 682 480 M 720 480 L 722 480 M 760 480 L 762 480 M 800 480 L 802 480 M 840 480 L 842 480 M 880 480 L 882 480" stroke="rgba(16, 185, 129, 0.15)" stroke-width="3" stroke-linecap="round"/>
        <path d="M 140 515 L 142 515 M 180 515 L 182 515 M 220 515 L 222 515 M 260 515 L 262 515 M 300 515 L 302 515 M 340 515 L 342 515 M 380 515 L 382 515 M 420 515 L 422 515 M 460 515 L 462 515 M 500 515 L 502 515 M 540 515 L 542 515 M 580 515 L 582 515 M 620 515 L 622 515 M 660 515 L 662 515 M 700 515 L 702 515 M 740 515 L 742 515 M 780 515 L 782 515 M 820 515 L 822 515 M 860 515 L 862 515" stroke="rgba(16, 185, 129, 0.15)" stroke-width="3" stroke-linecap="round"/>
        <path d="M 120 550 L 122 550 M 160 550 L 162 550 M 200 550 L 202 550 M 240 550 L 242 550 M 280 550 L 282 550 M 320 550 L 322 550 M 360 550 L 362 550 M 400 550 L 402 550 M 440 550 L 442 550 M 480 550 L 482 550 M 520 550 L 522 550 M 560 550 L 562 550 M 600 550 L 602 550 M 640 550 L 642 550 M 680 550 L 682 550 M 720 550 L 722 550 M 760 550 L 762 550 M 800 550 L 802 550 M 840 550 L 842 550 M 880 550 L 882 550" stroke="rgba(16, 185, 129, 0.15)" stroke-width="3" stroke-linecap="round"/>

        <!-- Labels -->
        <text x="500" y="525" fill="#10b981" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="900" letter-spacing="2" text-anchor="middle">KHU ĐỨNG TỰ DO (WAVY GA)</text>
        <text x="500" y="548" fill="#ffffff" fill-opacity="0.35" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="bold" letter-spacing="0.5" text-anchor="middle">Khu vực đứng tự do · Không phân định số ghế</text>
    </g>
</svg>
